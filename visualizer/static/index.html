<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Conceptuum — визуализатор базы понятий</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --line: #2a3550; --txt: #dbe4f5;
    --dim: #7f8db3; --acc: #5ea2ff; --acc2: #7ef0c8; --warn: #ffc857;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt);
         font: 14px/1.45 "Segoe UI", system-ui, sans-serif; height: 100vh; overflow: hidden; }
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  /* левая панель */
  #side { background: var(--panel); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; min-height: 0; }
  #sideHead { display: flex; align-items: flex-start; justify-content: space-between;
              gap: 8px; margin: 14px 12px 6px; }
  #side h1 { font-size: 16px; margin: 0; color: var(--acc2); flex: 1; }
  #side h1 small { color: var(--dim); font-weight: normal; font-size: 11px; display: block; }
  #langBar { display: flex; gap: 4px; flex: none; }
  #langBar button { background: var(--bg); color: var(--dim); border: 1px solid var(--line);
                    border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 11px; }
  #langBar button.on { color: var(--acc2); border-color: var(--acc2); }
  #search { margin: 8px 12px; padding: 9px 12px; background: var(--bg); color: var(--txt);
            border: 1px solid var(--line); border-radius: 8px; outline: none; }
  #search:focus { border-color: var(--acc); }
  #list { overflow-y: auto; flex: 1; padding: 4px 6px 20px; }
  .item { padding: 6px 10px; border-radius: 7px; cursor: pointer; display: flex;
          justify-content: space-between; gap: 8px; align-items: baseline; }
  .item:hover { background: #20293f; }
  .item.sel { background: #24375e; }
  .item .u { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .item .p { width: 14px; flex: none; font-size: 10px; }
  .item .p.ok { color: var(--acc2); }
  .item .p.no { color: var(--dim); }
  .item .n { flex: 1; }
  /* правая часть */
  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #info { padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
          max-height: 42vh; overflow-y: auto; }
  #info h2 { margin: 4px 0 2px; font-size: 20px; }
  #info h2 .uni { color: var(--dim); font-size: 12px; font-weight: normal; margin-left: 10px; }
  #defin { color: var(--acc2); margin: 4px 0 8px; white-space: pre-wrap; }
  .cols { display: flex; gap: 28px; flex-wrap: wrap; }
  .cols h3 { margin: 6px 0 3px; font-size: 12px; text-transform: uppercase; color: var(--dim); }
  .tag { display: inline-block; background: #20293f; border-radius: 6px; padding: 1px 8px;
         margin: 2px 3px 2px 0; cursor: pointer; }
  .tag:hover { background: #2c3c61; color: #fff; }
  .tag small { color: var(--dim); font-size: 10px; margin-left: 4px; }
  .rel { margin: 2px 0; }
  .rel .k { color: var(--warn); }
  .rel .s { color: var(--dim); font-size: 11px; }
  #treeWrap { flex: 1; overflow: auto; position: relative; }
  svg { display: block; margin: 0 auto; }
  .node rect { fill: #1d2740; stroke: var(--line); rx: 8; cursor: pointer; }
  .node:hover rect { stroke: var(--acc); }
  .node.center rect { fill: #2c4a7c; stroke: var(--acc); stroke-width: 2; }
  .node.up rect { fill: #232d47; }
  .node.genus rect { fill: #1e3350; stroke: #4a7ab0; }
  .node text { fill: var(--txt); font-size: 13px; }
  .node .cnt { fill: var(--dim); font-size: 10px; }
  .edge.genus { stroke: #5ea2ff; stroke-width: 1.6; }
  .edge { stroke: #3a4a75; stroke-width: 1.4; fill: none; }
  .edge.rel { stroke: #8f7fd4; stroke-dasharray: 5 4; }
  .edgeLbl { fill: #a08fe0; font-size: 10px; }
  .node.rel rect { fill: #262040; stroke: #6a5a9e; stroke-dasharray: 4 3; }
  #hint { color: var(--dim); text-align: center; margin-top: 40vh; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div id="sideHead">
      <h1>Conceptuum <small id="sub"></small></h1>
      <div id="langBar">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <input id="search" autofocus>
    <div id="list"></div>
  </div>
  <div id="main">
    <div id="info"><div id="hint"></div></div>
    <div id="treeWrap"></div>
  </div>
</div>
<script>
const I18N = {
  ru: {
    title: 'Conceptuum — визуализатор базы понятий',
    sub: 'база логических связей понятий',
    search: 'поиск понятия… (ru / en)',
    hint: 'Начните вводить слово слева — например, «чашка», «тяжёлое», «месяц».',
    genus: 'Род', genera: 'Роды', species: 'Виды', rels: 'Связи', terms: 'Термины',
    processed: 'обработано', unprocessed: 'не обработано',
    definTitle: 'генерируемая дефиниция (род + отличия + виды)',
    nSpecies: n => n + ' видов',
    uni: {1:'бытовой',2:'научный',3:'IT',4:'юридический',5:'логика'},
    seed: 'а'
  },
  en: {
    title: 'Conceptuum — concept base viewer',
    sub: 'a relational knowledge base of concepts',
    search: 'search a concept… (en / ru)',
    hint: 'Type a word on the left — e.g. “cup”, “heavy”, “month”.',
    genus: 'Genus', genera: 'Genera', species: 'Species', rels: 'Relations', terms: 'Terms',
    processed: 'processed', unprocessed: 'unprocessed',
    definTitle: 'generated definition (genus + differentia + species)',
    nSpecies: n => n + ' species',
    uni: {1:'everyday',2:'scientific',3:'IT',4:'legal',5:'logic'},
    seed: 'a'
  }
};
function browserLang() {
  const l = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  return l.startsWith('ru') ? 'ru' : 'en';
}
let lang = localStorage.getItem('conceptuum-lang') || browserLang();
if (lang !== 'ru' && lang !== 'en') lang = 'en';
const T = () => I18N[lang];
const uniName = id => T().uni[id] || id;
const $ = s => document.querySelector(s);
const listEl = $('#list'), infoEl = $('#info'), treeEl = $('#treeWrap');
let selId = null, deb = null, lastQ = '';

function applyI18n() {
  document.documentElement.lang = lang;
  document.title = T().title;
  $('#sub').textContent = T().sub;
  $('#search').placeholder = T().search;
  const hint = $('#hint');
  if (hint) hint.textContent = T().hint;
  document.querySelectorAll('#langBar button').forEach(b => {
    b.classList.toggle('on', b.dataset.lang === lang);
  });
}
function setLang(l) {
  if (l !== 'ru' && l !== 'en') return;
  lang = l;
  localStorage.setItem('conceptuum-lang', lang);
  applyI18n();
  const q = $('#search').value.trim() || lastQ;
  if (selId) show(selId);
  if (q) doSearch(q);
  else bootList();
}
document.querySelectorAll('#langBar button').forEach(b => {
  b.onclick = () => setLang(b.dataset.lang);
});
function withLang(url) {
  return url + (url.includes('?') ? '&' : '?') + 'lang=' + encodeURIComponent(lang);
}

// --- поиск ---
$('#search').addEventListener('input', e => {
  clearTimeout(deb);
  deb = setTimeout(() => doSearch(e.target.value), 200);
});
async function doSearch(q) {
  if (!q.trim()) { listEl.innerHTML = ''; return; }
  lastQ = q;
  const r = await fetch(withLang('/api/search?q=' + encodeURIComponent(q)));
  const rows = await r.json();
  listEl.innerHTML = '';
  for (const c of rows) {
    const d = document.createElement('div');
    d.className = 'item' + (c.id === selId ? ' sel' : '');
    d.innerHTML = `<span class="p ${c.processed ? 'ok' : 'no'}" title="${c.processed ? T().processed : T().unprocessed}">${c.processed ? '●' : '○'}</span><span class="n">${esc(c.nama)}</span><span class="u">${uniName(c.uni)}</span>`;
    d.onclick = () => show(c.id);
    listEl.appendChild(d);
  }
}

// --- карточка + дерево ---
async function show(id) {
  selId = id;
  document.querySelectorAll('.item.sel').forEach(e => e.classList.remove('sel'));
  const r = await fetch(withLang(`/api/tree?id=${id}&depth=3`));
  if (!r.ok) return;
  const t = await r.json();
  renderInfo(t.center);
  renderTree(t);
}

function relTag(c) {
  return `<span class="tag" onclick="show(${c.id})">${esc(c.nama)}</span>`;
}
function genusTag(c) {
  const u = uniName(c.edgeUni || c.uni);
  return `<span class="tag" onclick="show(${c.id})">${esc(c.nama)}<small>${esc(u)}</small></span>`;
}

function renderInfo(c) {
  let h = `<h2>${esc(c.nama)}<span class="uni">${esc(c.uniName)} · id ${c.id}${c.processed ? ' · ✓' : ''}</span></h2>`;
  if (c.genDefin) h += `<div id="defin" title="${esc(T().definTitle)}">${esc(c.genDefin)}</div>`;
  h += '<div class="cols">';
  const parents = c.parents || [];
  if (parents.length)
    h += `<div><h3>${parents.length > 1 ? T().genera : T().genus}</h3>${parents.map(genusTag).join('')}</div>`;
  if (c.children.length)
    h += `<div><h3>${T().species} (${c.children.length})</h3>${c.children.slice(0, 60).map(relTag).join('')}${c.children.length > 60 ? ' …' : ''}</div>`;
  if (c.rels.length) {
    h += `<div><h3>${T().rels}</h3>`;
    for (const r of c.rels) {
      const arrow = r.dir === 'out' ? '→' : '←';
      const s = r.strength != null && r.strength !== 0 ? ` <span class="s">${r.strength}%</span>` :
                (r.strength === 0 ? ' <span class="s">¬</span>' : '');
      h += `<div class="rel"><span class="k">${esc(r.kod)} ${esc(r.name)}</span> ${arrow} ${relTag(r.other)}${s}</div>`;
    }
    h += '</div>';
  }
  const ru = c.terms.filter(t => t.lang === 'ru').map(t => t.term);
  const en = c.terms.filter(t => t.lang === 'en').map(t => t.term);
  if (ru.length || en.length) {
    const termTag = t => `<span class="tag" onclick="doSearchTerm(this.textContent)">${esc(t)}</span>`;
    h += `<div><h3>${T().terms}</h3><div>${ru.map(termTag).join('')}</div>` +
         `<div>${en.map(termTag).join('')}</div></div>`;
  }
  h += '</div>';
  infoEl.innerHTML = h;
}

// --- дерево: роды вверху, виды внизу (виды — сетка, не одна линия) ---
const NW = 168, NH = 40, GX = 14, GY = 46;
let COLS = 8;

function maxCols() {
  const avail = treeEl.clientWidth || 900;
  return Math.max(4, Math.min(10, Math.floor((avail - 32) / (NW + GX))));
}

function wrapRows(children, depth) {
  const rows = [];
  let row = [], w = 0;
  for (const c of children) {
    const cw = measure(c, depth);
    if (row.length && w + cw > COLS) {
      rows.push({ items: row, w });
      row = [];
      w = 0;
    }
    row.push({ c, cw });
    w += cw;
  }
  if (row.length) rows.push({ items: row, w });
  return rows;
}

function measure(n, depth) {
  if (!n.children || !n.children.length || depth <= 0) return 1;
  const rows = wrapRows(n.children, depth - 1);
  return Math.max(1, ...rows.map(r => r.w));
}

function heightDown(n, depth) {
  if (!n.children || !n.children.length || depth <= 0) return 1;
  const rows = wrapRows(n.children, depth - 1);
  let h = 1;
  for (const row of rows)
    h += Math.max(...row.items.map(({ c }) => heightDown(c, depth - 1)));
  return h;
}

let nodes = [], links = [];
function placeDown(n, x0, y, depth, allocW) {
  const w = allocW != null ? allocW : measure(n, depth);
  const nx = x0 + w / 2;
  nodes.push({ id: n.id, nama: n.nama, x: nx, y, cnt: n.childCount, cls: '' });
  if (!n.children || depth <= 0) return;
  const rows = wrapRows(n.children, depth - 1);
  let yb = y + 1;
  for (const row of rows) {
    let cx = x0 + (w - row.w) / 2;
    const rowH = Math.max(...row.items.map(({ c }) => heightDown(c, depth - 1)));
    for (const { c, cw } of row.items) {
      placeDown(c, cx, yb, depth - 1, cw);
      links.push([nx, y, cx + cw / 2, yb]);
      cx += cw;
    }
    yb += rowH;
  }
}

let MAXD = 3, UPD = 8;
function heightUp(n, depth) {
  if (!n || !n.parents || !n.parents.length || depth <= 0) return 1;
  let h = 0;
  for (const p of n.parents) h = Math.max(h, heightUp(p, depth - 1));
  return 1 + h;
}
function measureUp(n, depth) {
  if (!n || !n.parents || !n.parents.length || depth <= 0) return 1;
  let w = 0;
  for (const p of n.parents) w += measureUp(p, depth - 1);
  return Math.max(w, 1);
}
function placeUp(n, x0, y, depth, cls) {
  const w = measureUp(n, depth);
  const nx = x0 + w / 2;
  const many = (n.parents || []).length > 1;
  nodes.push({
    id: n.id, nama: n.nama, x: nx, y, cnt: n.childCount,
    cls: cls || (many ? 'up genus' : 'up'),
    uni: n.uni, edgeUni: n.edgeUni
  });
  if (n.parents && depth > 0) {
    let cx = x0;
    for (const p of n.parents) {
      const pw = measureUp(p, depth - 1);
      placeUp(p, cx, y - 1, depth - 1, 'up');
      const px = cx + pw / 2;
      const u = p.edgeUni || p.uni;
      const lbl = (n.parents.length > 1 && u) ? uniName(u) : '';
      genusLinks.push({ x1: px, y1: y - 1, x2: nx, y2: y, lbl });
      cx += pw;
    }
  }
  return { nx, w };
}

let genusLinks = [];
function renderTree(t) {
  nodes = []; links = [];
  const relLinks = [];
  genusLinks = [];
  COLS = maxCols();
  const downW = measure(t.down, MAXD);
  const upW = measureUp(t.up, UPD);
  const sats = t.center.rels || [];
  const satRows = [];
  for (let i = 0; i < sats.length; i += COLS) satRows.push(sats.slice(i, i + COLS));
  const satShift = satRows.length;
  const forestW = Math.max(downW, upW, 1);
  const off = 0;
  const x0 = off + (forestW - upW) / 2;
  const y0 = heightUp(t.up, UPD) - 1;
  const placed = placeUp(t.up, x0, y0, UPD, 'center');
  const upX = placed.nx;
  satRows.forEach((row, ri) => {
    row.forEach((r, i) => {
      const sx = upX + (i - (row.length - 1) / 2);
      const st = r.strength != null && r.strength !== 0 ? ` ${r.strength}%` : (r.strength === 0 ? ' ¬' : '');
      const lbl = (r.dir === 'out' ? `${r.kod} ${r.name} →` : `← ${r.kod} ${r.name}`) + st;
      nodes.push({ id: r.other.id, nama: r.other.nama, x: sx, y: y0 + 1 + ri, cnt: 0, cls: 'rel' });
      relLinks.push({ x1: upX, y1: y0, x2: sx, y2: y0 + 1 + ri, lbl });
    });
  });
  let downH = 0;
  if (t.down.children && t.down.children.length) {
    const rows = wrapRows(t.down.children, MAXD - 1);
    const gridW = Math.max(...rows.map(r => r.w));
    const downOff = off + (forestW - gridW) / 2;
    let yb = y0 + 1 + satShift;
    for (const row of rows) {
      let cx = downOff + (gridW - row.w) / 2;
      const rowH = Math.max(...row.items.map(({ c }) => heightDown(c, MAXD - 1)));
      for (const { c, cw } of row.items) {
        placeDown(c, cx, yb, MAXD - 1, cw);
        links.push([upX, y0, cx + cw / 2, yb]);
        cx += cw;
      }
      yb += rowH;
    }
    downH = yb - (y0 + 1 + satShift);
  }
  const colW = forestW + 1;
  const W = Math.max(colW * (NW + GX), treeEl.clientWidth || 300);
  const H = (y0 + 1 + satShift + downH + 0.4) * (NH + GY);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  const path = (x1, y1, x2, y2, cls) => {
    const X1 = x1 * (NW + GX), Y1 = y1 * (NH + GY) + NH;
    const X2 = x2 * (NW + GX), Y2 = y2 * (NH + GY);
    const my = (Y1 + Y2) / 2;
    return `<path class="${cls}" d="M ${X1} ${Y1} C ${X1} ${my}, ${X2} ${my}, ${X2} ${Y2}"/>`;
  };
  for (const [x1, y1, x2, y2] of links) s += path(x1, y1, x2, y2, 'edge');
  for (const g of genusLinks) {
    s += path(g.x1, g.y1, g.x2, g.y2, g.lbl ? 'edge genus' : 'edge');
    if (g.lbl) {
      const lx = (g.x1 + g.x2) / 2 * (NW + GX), ly = (g.y1 + g.y2) / 2 * (NH + GY) + NH / 2;
      s += `<text class="edgeLbl" x="${lx}" y="${ly}" text-anchor="middle">${esc(g.lbl)}</text>`;
    }
  }
  for (const r of relLinks) {
    s += path(r.x1, r.y1, r.x2, r.y2, 'edge rel');
    const lx = (r.x1 + r.x2) / 2 * (NW + GX), ly = (r.y1 + r.y2) / 2 * (NH + GY) + NH / 2;
    s += `<text class="edgeLbl" x="${lx}" y="${ly}" text-anchor="middle">${esc(r.lbl)}</text>`;
  }
  for (const n of nodes) {
    const X = n.x * (NW + GX) - NW / 2, Y = n.y * (NH + GY);
    const sub = n.cls && n.cls.includes('up') && n.edgeUni
      ? uniName(n.edgeUni)
      : (n.cnt ? T().nSpecies(n.cnt) : '');
    s += `<g class="node ${n.cls}" onclick="show(${n.id})">
      <rect x="${X}" y="${Y}" width="${NW}" height="${NH}"/>
      <text x="${X + NW / 2}" y="${Y + 17}" text-anchor="middle">${esc(trunc(n.nama))}</text>
      ${sub ? `<text class="cnt" x="${X + NW / 2}" y="${Y + 32}" text-anchor="middle">${esc(sub)}</text>` : ''}
    </g>`;
  }
  treeEl.innerHTML = s + '</svg>';
}

function trunc(s) { return s.length > 22 ? s.slice(0, 21) + '…' : s; }
function doSearchTerm(t) { $('#search').value = t; doSearch(t); }
let rz = null;
window.addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(() => { if (selId) show(selId); }, 160);
});
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function bootList() {
  doSearch(T().seed);
}
applyI18n();
bootList();
</script>
</body>
</html>
